name: Transfer narration for editing (manual)
on:
  workflow_dispatch:
    inputs:
      narration_url:
        description: 'Temporary download URL for an approved narration asset'
        required: true
        type: string
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - name: Transfer approved narration
        env:
          NARRATION_URL: ${{ inputs.narration_url }}
        run: |
          mkdir -p out
          curl -fL --retry 3 "$NARRATION_URL" -o out/narration.mp3
          test -s out/narration.mp3
          sha256sum out/narration.mp3 > out/audio-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: research-v2-narration
          path: out/
          if-no-files-found: error
